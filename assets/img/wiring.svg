<svg width="1400" height="950" viewBox="0 0 1400 950" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="1400" height="950" fill="#16324A"/>
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0 L0 0 0 24" fill="none" stroke="#28516F" stroke-width="0.5"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1400" height="950" fill="url(#g)"/>
<rect x="16" y="16" width="1368" height="918" fill="none" stroke="#DCE9F2" stroke-width="1.5"/>

<text x="700" y="46" text-anchor="middle" fill="#F3F8FB" font-size="22" font-weight="700" letter-spacing="1">GYRO-CONTROLLED LIGHT — FULL SYSTEM WIRING</text>
<text x="700" y="66" text-anchor="middle" fill="#9FC1D6" font-size="12">Wearable controller (left) &#8594; wireless ESP-NOW &#8594; base station (right)</text>

<g font-size="11">
  <line x1="40" y1="90" x2="70" y2="90" stroke="#E4572E" stroke-width="3"/><text x="78" y="94" fill="#F3F8FB">power (+)</text>
  <line x1="40" y1="107" x2="70" y2="107" stroke="#DCE9F2" stroke-width="3"/><text x="78" y="111" fill="#F3F8FB">ground / return (&#8211;)</text>
  <line x1="40" y1="124" x2="70" y2="124" stroke="#5BC8D9" stroke-width="3"/><text x="78" y="128" fill="#F3F8FB">signal / data</text>
</g>

<!-- ============ WEARABLE SIDE ============ -->
<text x="60" y="160" fill="#9FC1D6" font-size="13" letter-spacing="1.5">WEARABLE CONTROLLER</text>

<rect x="60" y="180" width="170" height="90" fill="none" stroke="#DCE9F2" stroke-width="1.4"/>
<text x="145" y="212" text-anchor="middle" fill="#F3F8FB" font-size="12" font-weight="700">POWER BANK A</text>
<text x="145" y="228" text-anchor="middle" fill="#9FC1D6" font-size="10">USB out, 5V</text>
<circle cx="230" cy="205" r="3" fill="#F3F8FB"/><text x="240" y="201" font-size="9">+5V</text>
<circle cx="230" cy="245" r="3" fill="#F3F8FB"/><text x="240" y="249" font-size="9">GND</text>

<rect x="60" y="320" width="170" height="110" fill="none" stroke="#DCE9F2" stroke-width="1.4"/>
<text x="145" y="348" text-anchor="middle" fill="#F3F8FB" font-size="12" font-weight="700">MPU6050</text>
<text x="145" y="364" text-anchor="middle" fill="#9FC1D6" font-size="10">gyro / IMU</text>
<circle cx="230" cy="345" r="3" fill="#F3F8FB"/><text x="240" y="341" font-size="9">VCC</text>
<circle cx="230" cy="375" r="3" fill="#F3F8FB"/><text x="240" y="379" font-size="9">GND</text>
<circle cx="230" cy="405" r="3" fill="#F3F8FB"/><text x="240" y="401" font-size="9">SDA</text>

<rect x="60" y="460" width="170" height="90" fill="none" stroke="#DCE9F2" stroke-width="1.4"/>
<text x="145" y="490" text-anchor="middle" fill="#F3F8FB" font-size="12" font-weight="700">LOCK BUTTON</text>
<text x="145" y="506" text-anchor="middle" fill="#9FC1D6" font-size="10">hold = active</text>
<circle cx="230" cy="485" r="3" fill="#F3F8FB"/><text x="240" y="481" font-size="9">leg A</text>
<circle cx="230" cy="520" r="3" fill="#F3F8FB"/><text x="240" y="524" font-size="9">leg B</text>

<rect x="400" y="160" width="220" height="430" fill="none" stroke="#DCE9F2" stroke-width="1.8"/>
<text x="510" y="188" text-anchor="middle" fill="#F3F8FB" font-size="14" font-weight="700">ESP32 — WEARABLE</text>
<circle cx="400" cy="205" r="3" fill="#F3F8FB"/><text x="388" y="201" text-anchor="end" font-size="9">5V/VIN</text>
<circle cx="400" cy="345" r="3" fill="#F3F8FB"/><text x="388" y="341" text-anchor="end" font-size="9">3.3V</text>
<circle cx="400" cy="405" r="3" fill="#F3F8FB"/><text x="388" y="401" text-anchor="end" font-size="9">GPIO21 SDA</text>
<circle cx="400" cy="485" r="3" fill="#F3F8FB"/><text x="388" y="481" text-anchor="end" font-size="9">GPIO4</text>
<circle cx="400" cy="560" r="3" fill="#F3F8FB"/><text x="388" y="556" text-anchor="end" font-size="9">GND</text>

<!-- straight signal/power lines, no crossings -->
<line x1="230" y1="205" x2="400" y2="205" stroke="#E4572E" stroke-width="2"/>
<line x1="230" y1="345" x2="400" y2="345" stroke="#E4572E" stroke-width="2"/>
<line x1="230" y1="405" x2="400" y2="405" stroke="#5BC8D9" stroke-width="2"/>
<line x1="230" y1="485" x2="400" y2="485" stroke="#5BC8D9" stroke-width="2"/>

<!-- ground drops, each own x offset so none overlap -->
<path d="M230,245 L250,245 L250,650" stroke="#DCE9F2" stroke-width="2" fill="none"/>
<path d="M230,375 L275,375 L275,650" stroke="#DCE9F2" stroke-width="2" fill="none"/>
<path d="M230,520 L300,520 L300,650" stroke="#DCE9F2" stroke-width="2" fill="none"/>
<path d="M400,560 L400,650" stroke="#DCE9F2" stroke-width="2" fill="none"/>

<line x1="250" y1="650" x2="400" y2="650" stroke="#DCE9F2" stroke-width="2.4"/>
<text x="250" y="672" fill="#9FC1D6" font-size="9">shared ground — bank, MPU6050, button, ESP32</text>

<!-- ============ ESP-NOW LINK ============ -->
<g>
  <path d="M620,330 C670,290 730,290 780,330" fill="none" stroke="#5BC8D9" stroke-width="1.6" stroke-dasharray="4 5"/>
  <path d="M675,295 A18,18 0 0 1 715,295" fill="none" stroke="#5BC8D9" stroke-width="1.2"/>
  <path d="M683,303 A10,10 0 0 1 707,303" fill="none" stroke="#5BC8D9" stroke-width="1.2"/>
  <text x="700" y="265" text-anchor="middle" fill="#5BC8D9" font-size="11" font-weight="700">ESP-NOW</text>
  <text x="700" y="250" text-anchor="middle" fill="#9FC1D6" font-size="9">wireless, no pairing needed</text>
</g>

<!-- ============ BASE STATION SIDE ============ -->
<text x="780" y="160" fill="#9FC1D6" font-size="13" letter-spacing="1.5">BASE STATION</text>

<!-- Wall adapter, powers ESP32 only -->
<rect x="780" y="60" width="180" height="80" fill="none" stroke="#DCE9F2" stroke-width="1.4"/>
<text x="870" y="92" text-anchor="middle" fill="#F3F8FB" font-size="12" font-weight="700">WALL ADAPTER</text>
<text x="870" y="108" text-anchor="middle" fill="#9FC1D6" font-size="10">5V USB — powers ESP32 only</text>
<circle cx="870" cy="140" r="3" fill="#F3F8FB"/>

<!-- ESP32 base -->
<rect x="780" y="180" width="200" height="290" fill="none" stroke="#DCE9F2" stroke-width="1.8"/>
<text x="880" y="208" text-anchor="middle" fill="#F3F8FB" font-size="14" font-weight="700">ESP32 — BASE</text>
<text x="880" y="224" text-anchor="middle" fill="#9FC1D6" font-size="9">USB power in (top)</text>
<circle cx="980" cy="255" r="3" fill="#F3F8FB"/><text x="990" y="251" font-size="9">GPIO18 pan</text>
<circle cx="980" cy="335" r="3" fill="#F3F8FB"/><text x="990" y="331" font-size="9">GPIO19 tilt</text>
<circle cx="980" cy="440" r="3" fill="#F3F8FB"/><text x="990" y="436" font-size="9">GND</text>

<line x1="870" y1="140" x2="870" y2="180" stroke="#E4572E" stroke-width="2.4"/>

<!-- Power bank feeding ONLY the servos -->
<rect x="780" y="560" width="200" height="100" fill="none" stroke="#DCE9F2" stroke-width="1.4"/>
<text x="880" y="592" text-anchor="middle" fill="#F3F8FB" font-size="12" font-weight="700">POWER BANK — SERVOS</text>
<text x="880" y="608" text-anchor="middle" fill="#9FC1D6" font-size="10">stripped USB-C cable, bare +/&#8211;</text>
<text x="880" y="624" text-anchor="middle" fill="#9FC1D6" font-size="10">5V out, 2A+</text>
<circle cx="980" cy="585" r="3" fill="#F3F8FB"/><text x="990" y="581" font-size="9">+5V (red)</text>
<circle cx="980" cy="635" r="3" fill="#F3F8FB"/><text x="990" y="639" font-size="9">GND (black)</text>

<!-- Pan / Tilt servos -->
<rect x="1140" y="210" width="180" height="110" fill="none" stroke="#DCE9F2" stroke-width="1.4"/>
<text x="1230" y="240" text-anchor="middle" fill="#F3F8FB" font-size="12" font-weight="700">PAN SERVO</text>
<text x="1230" y="256" text-anchor="middle" fill="#9FC1D6" font-size="10">rotates base</text>
<circle cx="1140" cy="255" r="3" fill="#F3F8FB"/><text x="1127" y="251" text-anchor="end" font-size="9">sig</text>
<circle cx="1140" cy="280" r="3" fill="#F3F8FB"/><text x="1127" y="276" text-anchor="end" font-size="9">pwr</text>
<circle cx="1140" cy="300" r="3" fill="#F3F8FB"/><text x="1127" y="296" text-anchor="end" font-size="9">gnd</text>

<rect x="1140" y="360" width="180" height="110" fill="none" stroke="#DCE9F2" stroke-width="1.4"/>
<text x="1230" y="390" text-anchor="middle" fill="#F3F8FB" font-size="12" font-weight="700">TILT SERVO</text>
<text x="1230" y="406" text-anchor="middle" fill="#9FC1D6" font-size="10">angles head</text>
<circle cx="1140" cy="405" r="3" fill="#F3F8FB"/><text x="1127" y="401" text-anchor="end" font-size="9">sig</text>
<circle cx="1140" cy="430" r="3" fill="#F3F8FB"/><text x="1127" y="426" text-anchor="end" font-size="9">pwr</text>
<circle cx="1140" cy="450" r="3" fill="#F3F8FB"/><text x="1127" y="446" text-anchor="end" font-size="9">gnd</text>

<!-- signal lines: straight, matched y -->
<line x1="980" y1="255" x2="1140" y2="255" stroke="#5BC8D9" stroke-width="2"/>
<line x1="980" y1="335" x2="1050" y2="335" stroke="#5BC8D9" stroke-width="2"/>
<path d="M1050,335 L1050,405 L1140,405" stroke="#5BC8D9" stroke-width="2" fill="none"/>

<!-- +5V bus from power bank up to both servo power pins -->
<path d="M980,585 L1060,585 L1060,280 L1140,280" stroke="#E4572E" stroke-width="2" fill="none"/>
<path d="M1060,280 L1060,430 L1140,430" stroke="#E4572E" stroke-width="2" fill="none"/>
<circle cx="1060" cy="280" r="3" fill="#E4572E"/>
<text x="1068" y="470" fill="#E4572E" font-size="9">+5V bus (servos only)</text>

<!-- ground rail base station -->
<path d="M980,635 L980,700" stroke="#DCE9F2" stroke-width="2" fill="none"/>
<path d="M980,440 L1005,440 L1005,700" stroke="#DCE9F2" stroke-width="2" fill="none"/>
<path d="M1140,300 L1090,300 L1090,700" stroke="#DCE9F2" stroke-width="2" fill="none"/>
<path d="M1140,450 L1115,450 L1115,700" stroke="#DCE9F2" stroke-width="2" fill="none"/>
<line x1="980" y1="700" x2="1115" y2="700" stroke="#DCE9F2" stroke-width="2.4"/>
<text x="780" y="740" fill="#F3F8FB" font-size="11" font-weight="700">Critical: even though the ESP32 and servo power bank are separate sources,</text>
<text x="780" y="756" fill="#F3F8FB" font-size="11" font-weight="700">their grounds still tie together here — required for the signal wires to work.</text>

<!-- ============ TITLE BLOCK ============ -->
<g font-size="11" fill="#F3F8FB">
<rect x="780" y="800" width="480" height="100" fill="none" stroke="#DCE9F2" stroke-width="1.2"/>
<line x1="780" y1="825" x2="1260" y2="825" stroke="#DCE9F2" stroke-width="0.8"/>
<line x1="1020" y1="800" x2="1020" y2="900" stroke="#DCE9F2" stroke-width="0.8"/>
<text x="790" y="818" fill="#9FC1D6" font-size="9">PROJ</text>
<text x="790" y="843" font-weight="700">Gyro-Controlled Task Light</text>
<text x="1030" y="818" fill="#9FC1D6" font-size="9">STATUS</text>
<text x="1030" y="843" font-weight="700">Electronics proven, mechanism in progress</text>
<line x1="780" y1="857" x2="1260" y2="857" stroke="#DCE9F2" stroke-width="0.8"/>
<text x="790" y="850" fill="#9FC1D6" font-size="9">REV / DATE</text>
<text x="790" y="875">C — Aug 2026</text>
<text x="1030" y="850" fill="#9FC1D6" font-size="9">DWG BY</text>
<text x="1030" y="875">M. Shutt</text>
</g>

</svg>
